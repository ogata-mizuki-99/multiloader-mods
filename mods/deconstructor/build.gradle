// Root build file for deconstructor multi-module project (common, neoforge, fabric)
plugins {
    id 'base'
    id 'idea'
}

// 親プロジェクト自体の空jar生成を無効化
tasks.matching { it.name in ['jar', 'assemble'] }.configureEach {
    enabled = false
}

subprojects {
    apply plugin: 'java-library'

    // 親プロジェクトのプロパティをサブプロジェクトへ継承
    parent.properties.each { key, val ->
        if (key.startsWith('mod_') || key in ['jei_version', 'minecraft_version_range']) {
            if (!project.hasProperty(key)) {
                project.ext.set(key, val)
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

apply from: rootProject.file('gradle/multiloader-root.gradle')
