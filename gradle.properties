# Shared Gradle / NeoForge settings for the public client monorepo.
# Per-mod mod_id / mod_version are in mods/<name>/gradle.properties.

org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.76

loom_version=1.17.21
fabric_loader_version=0.19.5
fabric_api_version=fabric-api:0.161.0+26.3
modmenu_version=21.0.0

deploy.minecraft.mods.enabled=false
