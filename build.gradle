plugins {
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

subprojects {
    tasks.withType(ProcessResources).configureEach {
        filteringCharset = 'UTF-8'
    }

    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            base {
                archivesName = "${project.name}-${minecraft_version}"
            }
        }
    }
}

// MDG createMinecraftArtifacts shares global NeoForm cache; parallel runs can fail on Windows.
gradle.projectsEvaluated {
    def artifactTasks = subprojects
            .collectMany { p -> p.tasks.matching { it.name == 'createMinecraftArtifacts' }.toList() }
            .sort { a, b -> "$a.project.path" <=> "$b.project.path" }
    for (int i = 1; i < artifactTasks.size(); i++) {
        artifactTasks[i].mustRunAfter(artifactTasks[i - 1])
    }
}
